<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Stardew Valley</title>
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
		html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
		#loading {
			position: absolute; inset: 0;
			display: flex; align-items: center; justify-content: center;
			color: #fff; font: 1.5rem/1 sans-serif;
			z-index: 1;
			flex-direction: column; gap: 1rem;
		}
		#loading.hidden { display: none; }
		#music-choice {
			display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
		}
		#music-choice button {
			font: 1.1rem/1 sans-serif; padding: 0.6rem 1.5rem;
			border: 2px solid #fff; border-radius: 6px;
			background: transparent; color: #fff; cursor: pointer;
			min-width: 260px; transition: background 0.15s;
		}
		#music-choice button:hover { background: rgba(255,255,255,0.15); }
		#music-choice .hint { font-size: 0.85rem; opacity: 0.6; }
		#progress-container {
			display: none; flex-direction: column; align-items: center; gap: 0.5rem; width: 80%; max-width: 400px;
		}
		#progress-container.visible { display: flex; }
		#progress-text { font-size: 0.9rem; opacity: 0.8; }
		#progress-bar {
			width: 100%; height: 24px; background: rgba(255,255,255,0.1); border-radius: 12px;
			border: 1px solid rgba(255,255,255,0.2); overflow: hidden;
		}
		#progress-fill {
			height: 100%; background: linear-gradient(90deg, #4CAF50, #81C784);
			width: 0%; transition: width 0.2s ease; display: flex; align-items: center; justify-content: center;
			font-size: 0.8rem; font-weight: bold;
		}
		canvas {
			width: 100%; height: 100%; display: block;
		}
	</style>
</head>
<body>
	<div id="loading">
		<div id="music-choice">
			<div>Download options</div>
			<button id="btn-no-music">Play without music <span class="hint">(~64 MB)</span></button>
			<button id="btn-with-music">Play with music <span class="hint">(~540 MB)</span></button>
		</div>
		<div id="progress-container">
			<div id="progress-text">Loading...</div>
			<div id="progress-bar">
				<div id="progress-fill">0%</div>
			</div>
		</div>
	</div>
	<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
	<script type="module" src="game.js"></script>
</body>
</html>
